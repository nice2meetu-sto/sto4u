<!-- ═══════════════════════════════════════════════════════════════
     공통 헤더 스니펫 — 다른 페이지에 그대로 붙여넣어 index.html 과 동일한 헤더 만들기
     구성: ① 폰트  ② CSS(색 변수 + 헤더 + 버튼)  ③ 헤더 마크업  ④ 버튼 JS
     ─ h1 / .sub 텍스트, 버튼은 각 페이지에 맞게 바꿔 쓰세요.
════════════════════════════════════════════════════════════════ -->

<!-- ① 폰트 (문서 <head> 안, 없으면 추가) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ② CSS (<style> 안에 병합. :root/ body 폰트가 이미 있으면 헤더·버튼 부분만 가져가세요) -->
<style>
  :root {
    --main: #534AB7;
    --valid: #3B6D11;
    --warn: #A32D2D;
    --border: #e2e4ea;
    --bg: #f5f6f9;
    --card: #ffffff;
    --text: #2b2d36;
    --muted: #7b7f8e;
    --main-soft: #ece9f8;
    --shadow: 0 1px 3px rgba(40, 42, 60, 0.06), 0 4px 16px rgba(40, 42, 60, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  /* ---------- 헤더 ---------- */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .topbar .brand { display: flex; align-items: center; gap: 12px; }
  .topbar .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--main); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .topbar .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .topbar .sync { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .topbar .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .topbar .sync.ok .dot { background: var(--valid); }
  .topbar .sync.err .dot { background: var(--warn); }
  .topbar .sync.demo .dot { background: #d99a00; }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; transition: all .12s ease;
  }
  button:hover { border-color: #c9ccd8; }
  button.primary { background: var(--main); border-color: var(--main); color: #fff; }
  button.primary:hover { background: #463ea0; }
</style>

<!-- ③ 헤더 마크업 (<body> 안, 보통 .app 컨테이너의 맨 위) -->
<header class="topbar">
  <div class="brand">
    <div class="logo">STO</div>
    <div>
      <h1>서울관광재단 인력현황 관리 시스템</h1>
      <div class="sub">2023.12.30 기준 명부 + 인사발령 리플레이 · 임의 기준일 현원 재구성</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div id="syncInfo" class="sync"><span class="dot"></span><span id="syncText">초기화 중…</span></div>
    <button id="sheetBtn" title="원본 구글 시트(DB) 열기 (비밀번호 필요)">📄 DB</button>
    <button id="refreshBtn" class="primary">↻ 새로고침</button>
  </div>
</header>

<!-- ④ 버튼 JS (<script> 안) -->
<script>
  // DB 버튼: 비밀번호 확인 후 원본 시트 새 탭으로
  const SHEET_URL = "https://docs.google.com/spreadsheets/d/1JsEod0DQlyfm7h0Jtr-wAnfLC7TjReZOlT_SQmWrvvI/edit?usp=sharing";
  const SHEET_PASSWORD = "stohr";
  document.getElementById("sheetBtn").onclick = () => {
    const pw = prompt("구글 시트 열람 비밀번호를 입력하세요.");
    if (pw === null) return;
    if (pw === SHEET_PASSWORD) window.open(SHEET_URL, "_blank", "noopener");
    else alert("비밀번호가 올바르지 않습니다.");
  };

  // 동기화 상태 표시 헬퍼 (각 페이지 로딩 로직에서 호출)
  //   setSync("ok",  "동기화 완료 · " + 시각);
  //   setSync("err", "로드 실패");   /  setSync("loading", "동기화 중…")
  function setSync(kind, text) {
    const el = document.getElementById("syncInfo");
    if (el) el.className = "sync " + ({ ok: "ok", err: "err", demo: "demo", loading: "" }[kind] || "");
    const t = document.getElementById("syncText");
    if (t) t.textContent = text;
  }

  // 새로고침 버튼: 각 페이지의 데이터 재로딩 함수에 연결하세요.
  //   document.getElementById("refreshBtn").onclick = () => loadData();
</script>
